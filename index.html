<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="<h1>Welcome to lmcompanyprofessionals.com</h1>">
    <meta name="theme-color" content="#215e6b">
    <title>Gender Equality Plan | Aenaon Eyzhn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --teal: #31859b;
            --teal-dark: #215e6b;
            --text: #3f4a5a;
            --muted: #5f6b7a;
            --line: #e5ecef;
            --bg-soft: #f5fafb;
            --max: 1100px;
            --font-head: 'Karla', Helvetica, Arial, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--text);
            background: #fff;
            line-height: 1.7;
            font-size: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        img { max-width: 100%; height: auto; display: block; }
        a { color: var(--teal); }
        a:focus-visible, button:focus-visible {
            outline: 3px solid #f2a900;
            outline-offset: 3px;
            border-radius: 3px;
        }

        .skip-link {
            position: absolute; left: -999px; top: 0;
            background: var(--teal-dark); color: #fff; padding: .75rem 1rem; z-index: 100;
        }
        .skip-link:focus { left: 0; }

        /* Header */
        .site-header {
            background: #fff;
            border-bottom: 1px solid var(--line);
            position: sticky; top: 0; z-index: 50;
        }
        .header-inner {
            max-width: var(--max);
            margin: 0 auto;
            padding: .75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .logo img { width: clamp(110px, 18vw, 170px); }

        .nav-toggle {
            display: none;
            background: none;
            border: 1px solid var(--teal);
            color: var(--teal);
            border-radius: 6px;
            padding: .5rem .75rem;
            font: 500 1rem var(--font-head);
            cursor: pointer;
        }

        .main-nav ul {
            list-style: none; margin: 0; padding: 0;
            display: flex; flex-wrap: wrap; gap: .25rem 1.25rem;
        }
        .main-nav a {
            font-family: var(--font-head);
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--teal);
            padding: .35rem 0;
            display: inline-block;
            border-bottom: 2px solid transparent;
            transition: color .2s, border-color .2s;
        }
        .main-nav a:hover, .main-nav a[aria-current="page"] { color: var(--teal-dark); border-color: var(--teal-dark); }

        @media (max-width: 900px) {
            .nav-toggle { display: inline-block; }
            .main-nav { display: none; width: 100%; order: 3; }
            .main-nav.open { display: block; }
            .header-inner { flex-wrap: wrap; }
            .main-nav ul { flex-direction: column; gap: 0; padding-bottom: .5rem; }
            .main-nav li { border-top: 1px solid var(--line); }
            .main-nav a { display: block; padding: .8rem .25rem; }
        }

        /* Main */
        main { flex: 1; width: 100%; }
        .hero {
            background: linear-gradient(180deg, var(--bg-soft), #fff);
            text-align: center;
            padding: clamp(2rem, 6vw, 4rem) 1.25rem 1.5rem;
        }
        .hero h1 {
            font-family: var(--font-head);
            font-weight: 500;
            color: var(--teal);
            font-size: clamp(1.6rem, 4.5vw, 2.5rem);
            margin: 0 0 .5rem;
            line-height: 1.2;
        }
        .hero p { margin: 0 auto; max-width: 42rem; color: var(--muted); }

        .layout {
            max-width: var(--max);
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 2.5rem;
        }
        .toc {
            position: sticky; top: 5.5rem; align-self: start;
            font-size: .92rem;
            border-left: 3px solid var(--line);
            padding-left: 1rem;
        }
        .toc h2 { font: 700 .8rem var(--font-head); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .5rem; }
        .toc ol { list-style: none; margin: 0; padding: 0; }
        .toc a { display: block; padding: .25rem 0; text-decoration: none; color: var(--text); }
        .toc a:hover { color: var(--teal); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; gap: 1rem; }
            .toc { position: static; border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; background: var(--bg-soft); }
            .toc details summary { cursor: pointer; font-family: var(--font-head); color: var(--teal); font-weight: 500; }
        }
        @media (min-width: 901px) { .toc summary { display: none; } .toc details > summary + * { display: block; } }

        article section { margin-bottom: 2.5rem; scroll-margin-top: 6rem; }
        article h2 {
            font-family: var(--font-head);
            font-weight: 500;
            color: var(--teal);
            font-size: clamp(1.25rem, 3vw, 1.6rem);
            margin: 0 0 .75rem;
            padding-bottom: .4rem;
            border-bottom: 1px solid var(--line);
        }
        article h3 { font-family: var(--font-head); font-weight: 500; color: var(--teal); font-size: 1.15rem; margin: 1.5rem 0 .5rem; }
        article h4 { font-family: var(--font-head); font-weight: 500; color: var(--teal-dark); font-size: 1.02rem; margin: 1.25rem 0 .4rem; }
        article p { margin: 0 0 1rem; }
        article ul { padding-left: 1.25rem; margin: 0 0 1rem; }
        article li { margin-bottom: .4rem; }
        .term { font-family: var(--font-head); font-weight: 700; color: var(--teal); }

        blockquote {
            margin: 1rem 0;
            padding: .75rem 1.25rem;
            background: var(--bg-soft);
            border-left: 4px solid var(--teal);
            border-radius: 0 6px 6px 0;
            font-size: .95rem;
        }
        blockquote p:last-child { margin-bottom: 0; }

        .legal-list { list-style: none; padding: 0; }
        .legal-list li {
            padding: .7rem 1rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: .93rem;
            overflow-wrap: anywhere;
        }

        /* Footer */
        .site-footer {
            background: var(--teal-dark);
            color: #fff;
            text-align: center;
            padding: 1.75rem 1.25rem;
            font-size: .9rem;
        }
        .site-footer address { font-style: normal; margin-bottom: .5rem; }
        .footer-links { display: flex; justify-content: center; gap: .5rem 1.5rem; flex-wrap: wrap; }
        .site-footer a { color: #fff; }
        .powered-by { font-size: .75rem; color: #c3d4d9; margin-top: .75rem; }

        @media print {
            .site-header, .toc, .skip-link { display: none; }
            .layout { display: block; }
            body { font-size: 11pt; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
     
    </header>

    <main id="content">
        <div class="hero">
            <h1>Welcome to lmcompanyprofessionals.com</h1>
        </div>

        <div class="layout">

            <article>
             
            </article>
        </div>
    </main>

    <footer class="site-footer">
        <div class="powered-by">Powered by LMpro</div>
    </footer>

 
</body>
</html>
